[project]
name = "dungeonmind-web-api"
version = "0.2.0"
description = "Public API/backend for the dungeonmind.net product."
authors = [
    {name = "Alan Meigs", email = "alan.meigs@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.4",
    "fal-client>=0.5.6",
    "itsdangerous>=2.2.0",
    "authlib>=1.3.2",
    "python-dotenv>=1.0.1",
    "openai>=2.14.0",
    "uvicorn>=0.32.0",
    "google-cloud-firestore>=2.19.0",
    "firebase-admin>=6.6.0",
    "python-multipart>=0.0.17",
    "boto3>=1.35.58",
    "pdf2image>=1.17.0",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "sentence-transformers>=3.3.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
    "pytest>=8.3.5",
    "generationengine",
    "cairosvg>=2.8.2",
    "pymongo>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-watch>=4.2.0",
]

[project.scripts]
dev-server = "dev_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "routers",
    "firestore",
    "cloudflare",
    "ruleslawyer",
    "cloudflareR2",
    "cardgenerator",
    "storegenerator",
    "playercharactergenerator",
    "statblocks_v1",
    "statblocks_v1.domain",
    "statblocks_v1.application",
    "statblocks_v1.infrastructure",
    "statblocks_v1.api",
]

[tool.uv.sources]
# Production: Use git-based dependency (works in Docker/CI)
generationengine = { git = "https://github.com/Drakosfire/GenerationEngine.git" }
# For local development, override with: generationengine = { path = "../GenerationEngine", editable = true }
# generationengine = { path = "../GenerationEngine", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
]


